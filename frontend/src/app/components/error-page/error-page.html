<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 via-blue-50 to-indigo-50 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 p-4">
  <div class="text-center max-w-md w-full animate-in fade-in slide-in-from-bottom-4 duration-500">
    
    <!-- Animated 404 Icon -->
    <div class="relative mb-8 h-32 flex items-center justify-center">
      <!-- Floating circles animation -->
      <div class="absolute w-32 h-32 rounded-full bg-gradient-to-br from-indigo-500/10 to-purple-500/10 animate-bounce" style="animation-duration: 3s;"></div>
      <div class="absolute w-24 h-24 rounded-full bg-gradient-to-br from-indigo-400/10 to-purple-400/10 animate-bounce" style="animation-duration: 4s; animation-delay: 0.5s;"></div>
      
      <!-- Error icon -->
      <div class="relative z-10">
        <svg class="w-24 h-24 text-indigo-600 dark:text-indigo-400 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 8v4m0 4v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
    </div>

    <!-- Error Code -->
    <h1 class="text-7xl font-black bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-400 dark:to-purple-400 bg-clip-text text-transparent mb-4 animate-in fade-in slide-in-from-bottom-2 duration-700">
      {{ errorCode() }}
    </h1>

    <!-- Error Title -->
    <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-3 animate-in fade-in slide-in-from-bottom-2 duration-700" style="animation-delay: 100ms;">
      {{ errorTitle() }}
    </h2>

    <!-- Error Message -->
    <p class="text-lg text-gray-600 dark:text-gray-400 mb-8 animate-in fade-in slide-in-from-bottom-2 duration-700" style="animation-delay: 200ms;">
      {{ errorMessage() }}
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center animate-in fade-in slide-in-from-bottom-2 duration-700" style="animation-delay: 300ms;">
      <a
        routerLink="/"
        *ngIf="showReturnHome()"
        class="px-6 py-3 rounded-xl font-semibold text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2.149-2.149a6 6 0 018.702 0L21 19M3 12l6.149-6.149a6 6 0 018.702 0L21 19m-18-7l6.724-6.724a6 6 0 018.702 0L21 19" />
        </svg>
        Return to Home
      </a>
      <button
        (click)="goBack()"
        class="px-6 py-3 rounded-xl font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border-2 border-gray-200 dark:border-gray-700 hover:border-indigo-500 dark:hover:border-indigo-400 transition-all duration-300 transform hover:scale-105 shadow-md hover:shadow-lg flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Go Back
      </button>
    </div>

    <!-- Decorative elements -->
    <div class="mt-12 pt-12 border-t border-gray-200 dark:border-gray-700">
      <p class="text-sm text-gray-500 dark:text-gray-500">
        Need help? <a href="mailto:support@example.com" class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium">Contact Support</a>
      </p>
    </div>
  </div>
</div>
