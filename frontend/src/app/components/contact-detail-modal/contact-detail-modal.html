<app-modal
  [isOpen]="isOpen()"
  [title]="contact()?.name || 'Contact Details'"
  [closeLabel]="'CLOSE' | translate"
  [showConfirm]="false"
  (close)="onClose()">

  <div *ngIf="contact()" class="space-y-4">
    <!-- Name -->
    <div class="bg-indigo-50 dark:bg-indigo-900/20 rounded-xl p-4 border border-indigo-200 dark:border-indigo-800">
      <p class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 uppercase">{{ 'NAME' | translate }}</p>
      <p class="text-lg font-bold text-gray-900 dark:text-white mt-1">{{ contact()?.name }}</p>
    </div>

    <!-- Status -->
    <div class="bg-gray-50 dark:bg-gray-900/50 rounded-xl p-4 border border-gray-200 dark:border-gray-700">
      <p class="text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase">{{ 'STATUS' | translate }}</p>
      <div class="mt-2 flex items-center gap-2">
        <span
          *ngIf="contact()?.isActive"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 rounded-full">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
          {{ 'ACTIVE' | translate }}
        </span>
        <span
          *ngIf="!contact()?.isActive"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400 rounded-full">
          <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
          {{ 'INACTIVE' | translate }}
        </span>
      </div>
    </div>

    <!-- Email -->
    <div *ngIf="contact()?.email" class="bg-blue-50 dark:bg-blue-900/20 rounded-xl p-4 border border-blue-200 dark:border-blue-800">
      <p class="text-xs font-semibold text-blue-600 dark:text-blue-400 uppercase">{{ 'EMAIL' | translate }}</p>
      <a
        [href]="'mailto:' + contact()?.email"
        class="text-lg font-semibold text-blue-600 dark:text-blue-400 hover:underline mt-1 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z" />
          <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z" />
        </svg>
        {{ contact()?.email }}
      </a>
    </div>

    <!-- Phone -->
    <div class="bg-green-50 dark:bg-green-900/20 rounded-xl p-4 border border-green-200 dark:border-green-800">
      <p class="text-xs font-semibold text-green-600 dark:text-green-400 uppercase">{{ 'PHONE' | translate }}</p>
      <a
        [href]="'tel:' + contact()?.phone"
        class="text-lg font-semibold text-green-600 dark:text-green-400 hover:underline mt-1 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 0 1 3-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 0 1-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 0 0 6.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 0 1 1.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 0 1-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5Z" clip-rule="evenodd" />
        </svg>
        {{ contact()?.phone }}
      </a>
    </div>
  </div>
</app-modal>
