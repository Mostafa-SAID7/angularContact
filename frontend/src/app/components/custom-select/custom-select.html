<div class="relative w-full z-[1000]">
  <!-- Label -->
  <label *ngIf="label()" [for]="id()" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
    {{ label() }}
  </label>

  <!-- Select Button -->
  <button
    [id]="id()"
    (click)="toggleOpen()"
    class="w-full px-4 py-2.5 text-left rounded-xl bg-white dark:bg-gray-800 border-2 border-gray-200 dark:border-gray-600 text-gray-900 dark:text-gray-100 focus:border-indigo-500 dark:focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/10 dark:focus:ring-indigo-400/20 focus:outline-none transition-all duration-300 font-medium hover:border-indigo-400 dark:hover:border-indigo-500 shadow-sm hover:shadow-md flex items-center justify-between gap-3"
    [ngClass]="{'border-indigo-500 dark:border-indigo-400': isOpen()}">
    <span class="flex-1">{{ getSelectedLabel() }}</span>
    <svg 
      class="w-4 h-4 text-gray-600 dark:text-gray-400 transition-transform duration-300 flex-shrink-0"
      [ngClass]="{'rotate-180': isOpen()}"
      fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
    </svg>
  </button>

  <!-- Dropdown Menu -->
  <div
    *ngIf="isOpen()"
    class="absolute top-full left-0 right-0 mt-2 bg-white dark:bg-gray-800 border-2 border-gray-200 dark:border-gray-600 rounded-xl shadow-2xl z-[9999] overflow-hidden animate-in fade-in slide-in-from-top-2 duration-200">
    <div class="max-h-64 overflow-y-auto">
      <button
        *ngFor="let option of options()"
        (click)="selectOption(option)"
        class="w-full px-4 py-3 text-left text-gray-900 dark:text-gray-100 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-colors duration-150 flex items-center justify-between gap-3 border-b border-gray-100 dark:border-gray-700 last:border-b-0"
        [ngClass]="{'bg-indigo-100 dark:bg-indigo-900/50 text-indigo-900 dark:text-indigo-100 font-semibold': option.value === value()}">
        <span>{{ option.label }}</span>
        <svg 
          *ngIf="option.value === value()" 
          class="w-4 h-4 text-indigo-600 dark:text-indigo-400 flex-shrink-0" 
          fill="currentColor" viewBox="0 0 24 24">
          <path fill-rule="evenodd" d="M19.915 3.5a.75.75 0 0 0-1.06 1.06L8.82 15.04a.75.75 0 0 1-1.06 0L4.145 11.46a.75.75 0 0 0-1.06 1.06l3.616 3.616a2.25 2.25 0 0 0 3.182 0l10.803-10.803a.75.75 0 0 0 0-1.06Z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Overlay to close dropdown -->
  <div
    *ngIf="isOpen()"
    (click)="isOpen.set(false)"
    class="fixed inset-0 z-[9998]"></div>
</div>
